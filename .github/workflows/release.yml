name: Build Module Release Zip

on:
  workflow_dispatch:
    inputs:
      base_zip_url:
        description: "上游 MFGA release zip URL（提供完整字体集；留空则只打包仓库字体）"
        required: false
        default: "https://github.com/Numbersf/MakeFontsGreatAgain/releases/download/1717180001/MFGA-17.0.0.06-27-alpha.1717180001.zip"
      strict:
        description: "字体缺失视为错误（严格模式）"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install NDK and build C tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget >/dev/null
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          TOOLCHAIN=$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p tools/prebuilt/bin
          $TOOLCHAIN/aarch64-linux-android21-clang tools/unicode_filter.c -O2 -s -o tools/prebuilt/bin/unicode_filter_arm64
          $TOOLCHAIN/armv7a-linux-androideabi21-clang tools/unicode_filter.c -O2 -s -o tools/prebuilt/bin/unicode_filter_arm
          $TOOLCHAIN/x86_64-linux-android21-clang tools/unicode_filter.c -O2 -s -o tools/prebuilt/bin/unicode_filter_x86_64
          $TOOLCHAIN/i686-linux-android21-clang tools/unicode_filter.c -O2 -s -o tools/prebuilt/bin/unicode_filter_x86
          $TOOLCHAIN/aarch64-linux-android21-clang tools/recolor_glyph.c -O2 -s -o tools/prebuilt/bin/recolor_glyph_arm64
          $TOOLCHAIN/armv7a-linux-androideabi21-clang tools/recolor_glyph.c -O2 -s -o tools/prebuilt/bin/recolor_glyph_arm
          $TOOLCHAIN/x86_64-linux-android21-clang tools/recolor_glyph.c -O2 -s -o tools/prebuilt/bin/recolor_glyph_x86_64
          $TOOLCHAIN/i686-linux-android21-clang tools/recolor_glyph.c -O2 -s -o tools/prebuilt/bin/recolor_glyph_x86
          file tools/prebuilt/bin/*

      - name: Download upstream base zip
        id: base
        run: |
          URL="${{ inputs.base_zip_url }}"
          if [ -z "$URL" ]; then
            echo "no base zip (workflow_dispatch with empty input)"
            exit 0
          fi
          if wget -q --timeout=60 -O upstream-base.zip "$URL"; then
            echo "downloaded: $(ls -lh upstream-base.zip | awk '{print $5}')"
            echo "base_zip=$PWD/upstream-base.zip" >> "$GITHUB_OUTPUT"
          else
            echo "警告: 上游 base zip 下载失败，将只打包仓库字体" >&2
          fi

      - name: Build module zip
        run: |
          set -e
          ARGS=()
          if [ -n "${{ steps.base.outputs.base_zip }}" ]; then
            ARGS+=(--base-zip "${{ steps.base.outputs.base_zip }}")
          fi
          ARGS+=(--bin-dir tools/prebuilt/bin)
          if [ "${{ inputs.strict }}" = "true" ]; then
            ARGS+=(--strict)
          fi
          tools/package/build_module.sh "${ARGS[@]}"

      - name: Verify zip structure
        run: |
          set -e
          ZIP=$(ls dist/MFGA-*.zip | head -1)
          echo "verifying: $ZIP"
          unzip -l "$ZIP" | grep -q "module.prop"
          unzip -l "$ZIP" | grep -q "customize.sh"
          unzip -l "$ZIP" | grep -q "webroot/index.html"
          unzip -l "$ZIP" | grep -q "system/fonts/"
          unzip -l "$ZIP" | grep -q "lang/lang.sh"
          echo "structure OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MFGA-module-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，只上传资产"
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --title "MFGA $TAG" \
              --notes "自动打包：完整字体集（含上游基底）+ 本 fork 定制与修复。详见 AUDIT.md。"
          fi
