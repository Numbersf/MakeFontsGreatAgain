name: Build MFGA-Xposed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mfga-xposed/**'
      - '.github/workflows/build-mfga-xposed.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper
        working-directory: mfga-xposed
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release APK
        working-directory: mfga-xposed
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        working-directory: mfga-xposed
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mfga-xposed-apk
          path: mfga-xposed/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
